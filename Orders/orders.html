<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Navbar/navbar.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"></script>
    <title>Pedidos a Proveedores</title>
  </head>

  <body>
    <header>
      <div id="navbar-placeholder"></div>
    </header>

    <div class="container">
      <div id="notification" class="notification"></div>

      <main>
        <!-- CABECERA -->

        <div
          class="header d-flex container-fluid align-items-center justify-content-between mb-4"
        >
          <h1>
            <i class="fas fa-clipboard-list"></i>
            Pedidos a Proveedores
          </h1>

          <div class="control">
            <form class="d-flex" role="search">
              <input
                class="form-control me-2 searchInput"
                id="searchInput"
                type="search"
                placeholder="Buscar producto"
                aria-label="Buscar producto"
              />

              <button
                type="button"
                class="btn btn-success searchButton"
                id="searchButton"
              >
                <i class="fas fa-search"></i>
                Buscar
              </button>
            </form>
          </div>
        </div>

        <!-- ACCIONES DEL PEDIDO -->

        <div
          id="orderActions"
          class="d-flex justify-content-between align-items-center mb-3"
          style="display: flex !important"
        >
          <button type="button" id="addProductPedido" class="btn btn-primary">
            <i class="fas fa-plus"></i>
            Agregar producto
          </button>
        </div>

        <!-- TABLA -->

        <div class="table-responsive" id="tableButtons">
          <table
            class="table table-hover table-bordered align-middle"
            id="table"
          >
            <!-- Datos cargados desde JavaScript -->
          </table>
        </div>

        <!-- BOTONES INFERIORES -->

        <div id="btn" class="d-grid gap-2 col-md-4 mx-auto mt-4">
          <button type="button" id="print" class="btn btn-info btn-lg">
            <i class="fas fa-print"></i>
            Imprimir Pedido
          </button>

          <button
            type="button"
            id="deleteAllPedidos"
            class="btn btn-danger btn-lg"
          >
            <i class="fas fa-trash"></i>
            Eliminar Pedido
          </button>
        </div>
      </main>
    </div>

    <!-- MODAL EDITAR CANTIDAD -->

    <div
      id="editPedidoModal"
      class="modal fade"
      tabindex="-1"
      aria-labelledby="editPedidoLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editPedidoLabel">Editar pedido</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>

          <form id="editPedidoForm">
            <div class="modal-body">
              <div class="mb-3">
                <label for="editPedidoProducto" class="form-label">
                  Producto
                </label>

                <input
                  type="text"
                  id="editPedidoProducto"
                  class="form-control"
                  readonly
                />
              </div>

              <div class="mb-3">
                <label for="editPedidoCantidad" class="form-label">
                  Cantidad a pedir
                </label>

                <input
                  type="number"
                  id="editPedidoCantidad"
                  class="form-control"
                  min="1"
                  step="1"
                  required
                />
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>

              <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i>
                Guardar cambios
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- MODAL AGREGAR PRODUCTO -->

    <div
      id="addPedidoModal"
      class="modal fade"
      tabindex="-1"
      aria-labelledby="addPedidoLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addPedidoLabel">
              Agregar producto al pedido
            </h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>

          <div class="modal-body">
            <!-- BUSCAR PRODUCTO -->

            <div class="mb-3">
              <label for="buscarProductoPedido" class="form-label">
                Buscar producto
              </label>

              <input
                type="text"
                id="buscarProductoPedido"
                class="form-control"
                placeholder="Escribí el nombre del producto..."
              />
            </div>

            <!-- RESULTADOS -->

            <div id="productosDisponiblesPedido" class="list-group">
              <div class="text-muted text-center p-3">
                Cargando productos...
              </div>
            </div>

            <!-- PRODUCTO SELECCIONADO -->

            <div
              id="productoSeleccionadoContainer"
              class="mt-4"
              style="display: none"
            >
              <div class="card">
                <div class="card-body">
                  <h6>Producto seleccionado</h6>

                  <p class="mb-2">
                    <strong> Producto: </strong>

                    <span id="productoSeleccionadoNombre"></span>
                  </p>

                  <p class="mb-3">
                    <strong> Stock actual: </strong>

                    <span id="productoSeleccionadoStock"></span>
                  </p>

                  <label for="cantidadNuevoPedido" class="form-label">
                    Cantidad a pedir
                  </label>

                  <input
                    type="number"
                    id="cantidadNuevoPedido"
                    class="form-control"
                    min="1"
                    step="1"
                    value="1"
                  />
                </div>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>

            <button
              type="button"
              id="confirmarAgregarPedido"
              class="btn btn-primary"
              disabled
            >
              <i class="fas fa-plus"></i>
              Agregar al pedido
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL VER PRODUCTO -->

    <div
      id="viewProducto"
      class="modal fade"
      tabindex="-1"
      aria-labelledby="viewProductoLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Detalle del pedido</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>

          <div class="modal-body">
            <p>
              <strong>Producto:</strong>
              <span id="name"></span>
            </p>

            <p>
              <strong>Cantidad a pedir:</strong>
              <span id="cantidad"></span>
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- BOOTSTRAP -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./orders.js"></script>
    <script type="module" src="../Navbar/navbar.js"></script>
  </body>
</html>
