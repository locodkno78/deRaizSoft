<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    />
    <link rel="stylesheet" href="../Navbar/navbar.css">
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="sales.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"></script>
    <script type="module" src="../firebase.js"></script>
    <title>Sales</title>
  </head>

  <body>
    <header>
      <div id="navbar-placeholder"></div>
    </header>
    <main>
      <div class="container">
        <div id="notification" class="notification"></div>
        <div class="header">
          <div class="title">
            <h1>Ventas</h1>
          </div>
          <div class="control">
            <form role="search" class="d-flex align-items-center">
              <input
                class="form-control me-2"
                id="searchInput"
                type="search"
                placeholder="Producto"
                aria-label="Search"
              />
              <button type="button" class="btn btn-success" id="searchButton">
                Buscar
              </button>
            </form>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover table-bordered" id="table">
            <thead>
              <tr>
                <th class="th">Nombre</th>
                <th class="th">Precio</th>
                <th class="th">Cantidad</th>
                <th class="th">Descuento (%)</th>
                <th class="th">Total</th>
                <th class="th">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <!-- Aquí se agregarán las filas dinámicamente -->
            </tbody>
            <tfoot>
              <tr>
                <td class="empty" colspan="4" style="text-align: right"></td>
                <td>Total General:</td>
                <td id="totalGeneral">$0.00</td>
              </tr>
            </tfoot>
          </table>
        </div>

        <div
          class="modal fade"
          id="productModal"
          tabindex="-1"
          aria-labelledby="productModalLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="productModalLabel">
                  Seleccionar Producto
                </h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body" id="modalBody">
                <!-- Aquí se cargarán los productos dinámicamente -->
              </div>
            </div>
          </div>
        </div>

        <!-- Botón Pagar -->
        <button type="button" class="btn btn-success" id="payButton">
          Pagar
        </button>

        <!-- Modal para seleccionar el método de pago -->
        <div
          class="modal fade"
          id="payModal"
          tabindex="-1"
          aria-labelledby="payModalLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="payModalLabel">
                  Seleccionar Método de Pago
                </h5>

                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>

              <div class="modal-body">
                <!-- Total -->
                <div class="mb-4 text-center">
                  <h5 id="totalToPay"></h5>
                </div>

                <!-- Métodos de pago -->
                <div class="mb-3">
                  <label class="form-label fw-bold"> Forma de pago </label>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="formaPago"
                      id="pagoEfectivo"
                      value="efectivo"
                    />
                    <label class="form-check-label" for="pagoEfectivo">
                      Efectivo
                    </label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="formaPago"
                      id="pagoTransferencia"
                      value="transferencia"
                    />
                    <label class="form-check-label" for="pagoTransferencia">
                      Transferencia
                    </label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="formaPago"
                      id="pagoDebito"
                      value="debito"
                    />
                    <label class="form-check-label" for="pagoDebito">
                      Débito
                    </label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="formaPago"
                      id="pagoCredito"
                      value="credito"
                    />
                    <label class="form-check-label" for="pagoCredito">
                      Crédito
                    </label>
                  </div>
                </div>

                <!-- Información de crédito -->
                <div id="creditoContainer" class="mb-3" style="display: none">
                  <label for="cuotas" class="form-label"> Cuotas </label>

                  <select class="form-select" id="cuotas">
                    <option value="1">1 cuota 0%</option>
                    <option value="3">3 cuotas 15%</option>
                    <option value="6">6 cuotas 25%</option>
                    <option value="12">12 cuotas 30%</option>
                  </select>
                </div>

                <button
                  type="button"
                  class="btn btn-success w-100"
                  id="finalizarPagoButton"
                >
                  Confirmar Pago
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
  <script type="module" src="../Navbar/navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</html>
