<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script type="module" src="account.js"></script>
    <script src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../firebase.js"></script>
    <title>Cuenta</title>
  </head>
  <body>
    <main class="account-page">
      <div class="account-container">
        <div class="account-heading">
          <div>
            <p class="eyebrow">Cuenta del cliente</p>
            <h1 id="customerName">Cargando cliente...</h1>
            <p id="customerDetails" class="customer-details"></p>
          </div>
          <a class="btn btn-success" href="../tableCustomers.html"
            >Volver a clientes</a
          >
        </div>

        <section class="purchases-section" aria-labelledby="purchasesTitle">
          <div class="section-heading">
            <h2 id="purchasesTitle">Compras realizadas</h2>
          </div>
          <div id="purchasesState" class="state-message">
            Cargando compras...
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle" id="purchasesTable">
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Producto</th>
                  <th>Cantidad</th>
                  <th>Precio unitario</th>
                  <th>Subtotal</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody></tbody>
              <tfoot>
                <tr>
                  <th colspan="4">Forma de pago</th>
                  <td colspan="2" id="purchasesPayments"></td>
                </tr>
                <tr>
                  <th colspan="4">Total</th>
                  <td colspan="2" id="purchasesTotal">Total: $0.00</td>
                </tr>
              </tfoot>
            </table>
          </div>
          <div class="account-actions">
            <button type="button" id="deleteAccount" class="btn btn-danger">
              <i class="fas fa-trash"></i>
              Eliminar cuenta
            </button>
          </div>
        </section>
      </div>
    </main>

    <div class="modal fade" id="editProductModal" tabindex="-1" aria-labelledby="editProductTitle" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title" id="editProductTitle">Editar producto</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <form id="editProductForm">
            <div class="modal-body">
              <div class="mb-3">
                <label for="editProductName" class="form-label">Producto</label>
                <input type="text" class="form-control" id="editProductName" required />
              </div>
              <div class="mb-3">
                <label for="editProductQuantity" class="form-label">Cantidad</label>
                <input type="number" class="form-control" id="editProductQuantity" min="0.01" step="0.01" required />
              </div>
              <div class="mb-3">
                <label for="editProductPrice" class="form-label">Precio unitario</label>
                <input type="number" class="form-control" id="editProductPrice" min="0" step="0.01" required />
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i>
                Guardar cambios
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
