<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Navbar</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <script src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"></script>
  </head>

  <body>
    <!-- NAVBAR PRINCIPAL -->

    <nav class="navbar navbar-expand-lg navbar-dark farmacia-navbar fixed-top">
      <div class="container-fluid px-3 px-lg-4">        

        <!-- BOTÓN MOBILE -->

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMenu"
          aria-controls="navbarMenu"
          aria-expanded="false"
          aria-label="Mostrar menú"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- MENÚ -->

        <div class="collapse navbar-collapse" id="navbarMenu">
          <div class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
            <!-- VENTAS -->

            <a
              class="nav-link navbar-item button-sales"
              href="../Sales/sales.html"
            >
              <i class="fas fa-cash-register"></i>

              <span>Ventas</span>
            </a>
            
            <!-- CLIENTES -->

            <a
              class="nav-link navbar-item button-clients"
              href="../Customers/tableCustomers.html"
            >
              <i class="fas fa-users"></i>

              <span>Clientes</span>
            </a>

            <!-- PEDIDOS -->

            <a
              class="nav-link navbar-item button-order"
              href="../Orders/orders.html"
            >
              <i class="fas fa-shopping-cart"></i>

              <span>Pedidos</span>
            </a>

            <!-- PRODUCTOS -->

            <a
              class="nav-link navbar-item button-products"
              href="../Products/products.html"
            >
              <i class="fas fa-pills"></i>

              <span>Productos</span>
            </a>

            <!-- HISTORIAL -->

            <a
              class="nav-link navbar-item button-history"
              href="../History/history.html"
            >
              <i class="fas fa-history"></i>

              <span>Historial</span>
            </a>           

            <!-- CERRAR SESIÓN -->

            <button type="button" class="navbar-item navbar-logout" id="logout">
              <i class="fas fa-sign-out-alt"></i>

              <span>Cerrar Sesión</span>
            </button>
          </div>
        </div>
      </div>
    </nav>
    
    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
